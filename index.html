<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E2F2A" />
    <meta
      name="description"
      content="Villa Nobel: sistema de atendimento e cardápio digital."
    />
    <meta
      property="og:title"
      content="Villa Nobel: atendimento e cardápio digital"
    />
    <meta
      property="og:description"
      content="Chamado de garçom, pedidos e cardápio em um só lugar."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E2F2A'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23F3F4F0'%3EV%3C/text%3E%3C/svg%3E"
    />
    <title>Villa Nobel | Entrar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body class="cmd-body">
    <div class="container-fluid p-0">
      <div class="row g-0 min-vh-100">
        <aside
          class="col-12 col-lg-6 d-flex cmd-painel-marca flex-column justify-content-between p-4 p-lg-5"
        >
          <img src="fotos/foto2.webp" alt="" class="cmd-imagem-fundo" />
          <span class="cmd-logo">Villa Nobel</span>

          <div class="cmd-letreiro">
            <span class="cmd-letreiro-nome">Villa Nobel</span>
            <span class="cmd-letreiro-linha"></span>
            <span class="cmd-letreiro-tipo">Restaurante</span>
          </div>
        </aside>

        <main
          class="col-12 col-lg-6 d-flex flex-column align-items-center justify-content-center p-4"
        >
          <div class="cmd-caixa-login w-100">
            <div class="mb-4">
              <span class="cmd-badge-sistema">VILLA NOBEL</span>
              <h2 class="cmd-titulo-login mt-2 mb-1">Acesse o sistema</h2>
              <p class="cmd-subtitulo-login mb-0">
                Entre com suas credenciais para continuar.
              </p>
            </div>

            <ul class="nav nav-tabs mb-4" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="tab-entrar"
                  data-bs-toggle="tab"
                  data-bs-target="#painel-entrar"
                  type="button"
                  role="tab"
                  aria-controls="painel-entrar"
                  aria-selected="true"
                >
                  Entrar
                </button>
              </li>

              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="tab-cadastro"
                  data-bs-toggle="tab"
                  data-bs-target="#painel-cadastro"
                  type="button"
                  role="tab"
                  aria-controls="painel-cadastro"
                  aria-selected="false"
                >
                  Criar conta de Cliente
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <section
                class="tab-pane fade show active"
                id="painel-entrar"
                role="tabpanel"
                aria-labelledby="tab-entrar"
              >
                <form id="form-login" novalidate>
                  <div class="mb-3">
                    <label for="login-email" class="form-label"> E-mail </label>

                    <input
                      type="email"
                      class="form-control form-control-lg"
                      id="login-email"
                      name="email"
                      autocomplete="email"
                      placeholder="Digite seu e-mail"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="login-senha" class="form-label"> Senha </label>

                    <input
                      type="password"
                      class="form-control form-control-lg"
                      id="login-senha"
                      name="senha"
                      autocomplete="current-password"
                      placeholder="********"
                      required
                    />
                  </div>

                  <div
                    id="login-erro"
                    class="alert alert-danger d-none"
                    role="alert"
                  ></div>

                  <button
                    type="submit"
                    class="btn btn-lg w-100 cmd-btn-principal"
                    id="btn-entrar"
                  >
                    Entrar
                  </button>

                  <p class="cmd-texto-apoio mt-3 mb-0">
                    Depois do login, cada perfil é levado para a sua tela.
                    Contas de atendente e de administrador são criadas pelo
                    administrador.
                  </p>
                </form>
              </section>

              <section
                class="tab-pane fade"
                id="painel-cadastro"
                role="tabpanel"
                aria-labelledby="tab-cadastro"
              >
                <form id="form-cadastro" novalidate>
                  <div class="mb-3">
                    <label for="cad-nome" class="form-label"> Nome </label>

                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="cad-nome"
                      autocomplete="name"
                      placeholder="Seu nome"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="cad-email" class="form-label"> E-mail </label>

                    <input
                      type="email"
                      class="form-control form-control-lg"
                      id="cad-email"
                      autocomplete="email"
                      placeholder="Digite seu e-mail"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <label for="cad-senha" class="form-label"> Senha </label>

                    <input
                      type="password"
                      class="form-control form-control-lg"
                      id="cad-senha"
                      autocomplete="new-password"
                      placeholder="Mínimo 6 caracteres"
                      minlength="6"
                      required
                    />
                  </div>

                  <div
                    id="cad-erro"
                    class="alert alert-danger d-none"
                    role="alert"
                  ></div>

                  <div
                    id="cad-sucesso"
                    class="alert alert-success d-none"
                    role="status"
                  ></div>

                  <button
                    type="submit"
                    class="btn btn-lg w-100 cmd-btn-principal"
                    id="btn-cadastrar"
                  >
                    Criar conta
                  </button>
                </form>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    <script src="js/villa-ux.js"></script>
  </body>
</html>
